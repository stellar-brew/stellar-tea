name: Build and Test
on:
  push:
    branches:
    - main
  pull_request: null
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  PKG_CONFIG_PATH: /usr/lib/pkgconfig
  NEXT_PUBLIC_STELLAR_NETWORK: LOCAL
  NEXT_PUBLIC_STELLAR_NETWORK_PASSPHRASE: Standalone Network ; February 2017
  NEXT_PUBLIC_STELLAR_RPC_URL: http://localhost:8000/rpc
  NEXT_PUBLIC_STELLAR_HORIZON_URL: http://localhost:8000
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: '~/.cargo/bin/

          runner/.cargo/bin/

          ~/.cargo/registry/index/

          ~/.cargo/registry/cache/

          ~/.cargo/git/db/

          target/

          '
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - run: rustup target add wasm32v1-none
    - name: Start Stellar Quickstart
      uses: stellar/quickstart@main
      with:
        tag: testing
        network: local
    - run: sudo apt-get update && sudo apt-get install -y libudev-dev libdbus-1-dev
        pkg-config
    - name: Install cargo-binstall
      uses: cargo-bins/cargo-binstall@v1.25.2
    - name: Check for stellar-scaffold binary
      run: "if ! command -v stellar-scaffold &> /dev/null; then\n  echo \"stellar-scaffold\
        \ not found, installing...\"\n  cargo binstall stellar-scaffold-cli\nelse\n\
        \  echo \"stellar-scaffold already installed. Clear cache to force reinstall.\"\
        \nfi\n"
    - run: npm ci
    - run: npm run lint
    - run: npx prettier . --check
    - name: Build clients before building the project
      run: STELLAR_SCAFFOLD_ENV=development stellar-scaffold build --build-clients
    - run: npm run install:contracts
    - run: npm run build
    - name: Run tests
      run: npm test --if-present
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 20
        cache: pnpm
    - uses: actions/cache@v3
      with:
        path: '~/.cargo/bin/

          runner/.cargo/bin/

          ~/.cargo/registry/index/

          ~/.cargo/registry/cache/

          ~/.cargo/git/db/

          target/

          '
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: Install cargo-binstall
      uses: cargo-bins/cargo-binstall@v1.15.6
    - run: pnpm install --frozen-lockfile
    - run: pnpm run lint
    - run: pnpm exec prettier . --check
    - run: pnpm run install:contracts
    - run: pnpm run build
    - name: Run tests
      run: pnpm test --if-present
  verify-clients:
    name: Verify workspace client deps
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Verify every workspace:* dependency resolves
      run: node .github/scripts/verify-workspace-deps.mjs
  generated-clients:
    name: Generated clients match src
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 20
        cache: pnpm
    - name: Install client package dependencies
      run: pnpm --filter "./packages/*" install
    - name: Rebuild client packages
      run: pnpm --filter "./packages/*" run build
    - name: Verify committed dist matches a fresh build
      run: "if ! git diff --exit-code -- 'packages/*/dist'; then\n  echo \"::error::Committed\
        \ packages/*/dist is out of date. Run 'pnpm --filter \\\"./packages/*\\\"\
        \ run build' and commit the result.\"\n  exit 1\nfi\n"
  ci-ok:
    name: CI OK
    if: always()
    needs:
    - build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Verify every required job succeeded
      run: "if [ \"${{ needs.build.result }}\" != \"success\" ]; then\n  echo \"::error::Required\
        \ job 'build' did not succeed (result: ${{ needs.build.result }})\"\n  exit\
        \ 1\nfi\necho \"All required jobs succeeded.\"\n"
  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 20
        cache: pnpm
    - name: Install workspace dependencies
      run: pnpm install --frozen-lockfile
    - name: Typecheck frontend
      run: pnpm --filter frontend exec tsc --noEmit
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 20
        cache: pnpm
    - name: Install workspace dependencies
      run: pnpm install --frozen-lockfile
    - name: Audit npm dependencies
      run: pnpm audit --audit-level=high
    - name: Install cargo-binstall
      uses: cargo-bins/cargo-binstall@38e8f5e4c386b611d51e8aa997b9a06a3c8eb67a
    - name: Audit Rust dependencies
      run: cargo binstall cargo-audit --no-confirm && cargo audit
  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 20
        cache: pnpm
    - name: Install workspace dependencies
      run: pnpm install --frozen-lockfile
    - name: Build frontend
      run: pnpm --filter frontend build
  secret-scan:
    name: Secret scanning (gitleaks)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
    - name: Run gitleaks
      uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
